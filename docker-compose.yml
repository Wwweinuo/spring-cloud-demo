services:
  mysql:
    # 使用 MySQL 8.4 LTS，适合本地学习和后续开发。
    image: mysql:8.4
    container_name: cloudmall-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cloud_mall
      TZ: Asia/Shanghai
    ports:
      # 默认使用 3306；如果宿主机已有 MySQL，可用 MYSQL_HOST_PORT=3307 覆盖。
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      # 数据目录已被 .gitignore 忽略，容器删除后数据仍可保留在本地。
      - ./docker/data/mysql:/var/lib/mysql
      # 首次创建数据目录时，MySQL 会按文件名顺序执行这里的 SQL。
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
