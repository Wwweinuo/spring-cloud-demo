# 开发环境：连接本机 Docker MySQL。
server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3306}/cloud_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
